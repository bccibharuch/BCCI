# BCCI Bharuch portal on one VPS: Caddy (HTTPS) → app → Postgres.
#
# Postgres holds everything: records, applicant accounts, sessions, OTP codes
# and rate limits. No Upstash, no other service. First-time setup is
# deploy/setup-vps.sh; day-to-day commands are in deploy/RUNBOOK.md.
#
#   docker compose up -d --build        # start or update
#   docker compose ps                   # what is running, and its health
#   docker compose logs -f app          # live app log
#
# Backups: deploy/backup.sh (a systemd timer runs it every 6 hours).

x-logging: &logging
  # Without a cap, container logs grow until the disk is full.
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Modest tuning for a small VPS (assumes >= 2 GB RAM). max_connections is
    # raised so several app workers can each hold a pool; see docs/SCALING.md.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500
    shm_size: 256mb
    environment:
      POSTGRES_USER: bcci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bcci
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bcci -d bcci']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql://bcci:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/bcci
      TRUST_PROXY: 1
      PORT: 3000
      HOST: 0.0.0.0
      # One worker per WEB_CONCURRENCY (bounded so RAM stays predictable).
      # Keep WEB_CONCURRENCY x PG_POOL_MAX below Postgres max_connections.
      CLUSTER: '1'
      WEB_CONCURRENCY: '4'
      PG_POOL_MAX: '10'
      NODE_OPTIONS: '--max-old-space-size=384'
      LOG_JSON: '1'
      STORAGE_TIMEOUT_MS: '8000'
      REQUEST_TIMEOUT_MS: '15000'
    # Reachable only from the server itself (deploy health checks); the
    # public reaches it through Caddy.
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Drain in-flight requests on redeploy before the container is killed.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1g
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env, e.g. bccibharuch.in}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Static files are served by Caddy directly. Only these paths are mounted
      # (never the repo root), so secrets like .env stay out of the web tier.
      - ./index.html:/srv/bcci/index.html:ro
      - ./css:/srv/bcci/css:ro
      - ./js:/srv/bcci/js:ro
      - ./assets:/srv/bcci/assets:ro
      - ./robots.txt:/srv/bcci/robots.txt:ro
      - ./sitemap.xml:/srv/bcci/sitemap.xml:ro
      - ./favicon.ico:/srv/bcci/favicon.ico:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
