# BCCI Bharuch portal on one VPS: Caddy (HTTPS) → app → Postgres.
#
# Postgres holds everything: records, applicant accounts, sessions, OTP codes
# and rate limits. No Upstash, no other service. First-time setup is
# deploy/setup-vps.sh; day-to-day commands are in deploy/RUNBOOK.md.
#
#   docker compose up -d --build        # start or update
#   docker compose ps                   # what is running, and its health
#   docker compose logs -f app          # live app log
#
# Backups: deploy/backup.sh (a systemd timer runs it every 6 hours).

x-logging: &logging
  # Without a cap, container logs grow until the disk is full.
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bcci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bcci
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bcci -d bcci']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql://bcci:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/bcci
      TRUST_PROXY: 1
      PORT: 3000
      HOST: 0.0.0.0
    # Reachable only from the server itself (deploy health checks); the
    # public reaches it through Caddy.
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(`http://localhost:3000/api/health`).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env, e.g. bccibharuch.in}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
