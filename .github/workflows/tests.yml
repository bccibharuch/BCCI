name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the "engines" target (Vercel, Docker); 22 is the oldest
        # maintained LTS that nodemailer 10 and --env-file support.
        node-version: ['22', '24']

    # Runs tests/postgres.test.mjs against a real database instead of skipping it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bcci
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: bcci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bcci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check

      # The suites use a mock Upstash and a local SMTP server, so no
      # credentials and no network access are needed.
      - name: Run tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://bcci:testpw@localhost:5433/bcci
