name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the "engines" target (Vercel); 22 is the oldest
        # maintained LTS that nodemailer 10 and --env-file support.
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check

      # Fails the build on a known high or critical vulnerability in a
      # production dependency.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # The suites use a mock Upstash and a local SMTP server, so no
      # credentials and no network access are needed.
      - name: Run tests
        run: npm test
